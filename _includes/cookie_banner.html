<!-- Apple Liquid Glass Cookie Consent Banner -->
<div id="cookie-consent-banner" class="cookie-banner-container cookie-banner-hidden" role="region" aria-label="Cookie & Privacy Consent" style="display: none;">
  <div class="cookie-banner-pill glass-card">
    <div class="glass-sheen" aria-hidden="true"></div>
    <div class="cookie-banner-content">
      <div class="cookie-banner-header">
        <div class="cookie-icon-badge">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div class="cookie-text-wrap">
          <h3 class="cookie-banner-title" data-i18n="cookie.title">Privacy & Cookies</h3>
          <p class="cookie-banner-text" data-i18n="cookie.desc">
            This website uses anonymous analytics cookies (Google Analytics via GTM) to understand traffic patterns and improve performance. Functional preferences (theme and language) use local storage.
          </p>
        </div>
      </div>
      <div class="cookie-banner-actions">
        <button id="cookie-decline-btn" class="glass-btn glass-btn-secondary cookie-action-btn" type="button">
          <span data-i18n="cookie.decline">Essential Only</span>
        </button>
        <button id="cookie-accept-btn" class="glass-btn glass-btn-primary cookie-action-btn" type="button">
          <i class="fa-solid fa-check"></i>
          <span data-i18n="cookie.accept">Accept All</span>
        </button>
      </div>
    </div>
  </div>
</div>
