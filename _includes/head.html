<!-- Google Consent Mode v2 (Default Denied for GDPR/ePrivacy Compliance) -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  (function() {
    try {
      var consent = localStorage.getItem('cookie_consent');
      var consentState = consent === 'granted' ? 'granted' : 'denied';
      gtag('consent', 'default', {
        'analytics_storage': consentState,
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied'
      });
    } catch(e) {
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied'
      });
    }
  })();
</script>

<!-- Critical Early Theme & Language Script (FOUC Prevention) -->
<script>
  (function () {
    try {
      var savedTheme = localStorage.getItem('theme');
      var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = savedTheme ? savedTheme : (systemDark ? 'dark' : 'light');
      if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) metaTheme.setAttribute('content', '#f5f5f7');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  })();
</script>
