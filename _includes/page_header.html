<div class="hero-section">
  <div class="hero-glass-panel">
    <!-- Status Pill -->
    <div class="hero-status-badge">
      <span class="status-dot"></span>
      <span class="status-text">Available for UI/UX & Web Development</span>
    </div>

    <!-- Title with Apple gradient -->
    <h1 class="hero-title" style="line-height: normal;">{{ site.texture.title }}</h1>
    
    <!-- Tagline & Bio description -->
    <p class="hero-tagline">
      Front-End Developer & UI/UX Designer crafting sleek web platforms, responsive experiences, and mobile apps with Apple-grade polish.
    </p>

    <!-- Category Filter Controls for Bento Grid -->
    <div class="hero-filter-wrapper">
      <div class="bento-filter-bar" role="tablist" aria-label="Project Category Filter">
        <button class="bento-filter-pill active" data-filter="all" role="tab" aria-selected="true">
          <i class="fa-solid fa-shapes"></i>
          <span>All Work</span>
        </button>
        <button class="bento-filter-pill" data-filter="web" role="tab" aria-selected="false">
          <i class="fa-solid fa-globe"></i>
          <span>Web Platforms</span>
        </button>
        <button class="bento-filter-pill" data-filter="mobile" role="tab" aria-selected="false">
          <i class="fa-brands fa-flutter"></i>
          <span>Mobile & Flutter</span>
        </button>
      </div>
    </div>
  </div>
</div>
